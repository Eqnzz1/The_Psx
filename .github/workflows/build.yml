name: Build OreMarket Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o OreMarket.zip
      - name: Build with Maven
        run: cd OreMarket && mvn -B package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: OreMarket-jar
          path: OreMarket/target/OreMarket.jar
